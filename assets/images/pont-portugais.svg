<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03045E"/>
      <stop offset="60%" stop-color="#0077B6"/>
      <stop offset="100%" stop-color="#00B4D8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bgGrad3)"/>

  <!-- Stylized Stone Masonry Multi-Arch Bridge -->
  <g transform="translate(70, 70)">
    <!-- Oum Er-Rbia Water Flow -->
    <path d="M0 130 C120 120 280 140 460 130 L460 170 L0 170 Z" fill="#90E0EF" opacity="0.4"/>
    <path d="M0 145 C150 135 300 155 460 145 L460 170 L0 170 Z" fill="#CAF0F8" opacity="0.6"/>

    <!-- Bridge Deck -->
    <rect x="10" y="60" width="440" height="20" rx="3" fill="#DDA15E"/>
    <rect x="5" y="55" width="450" height="8" rx="2" fill="#826144"/>

    <!-- 4 Stone Arches & Piers -->
    <path d="M20 80 L60 80 C60 55 120 55 120 80 L160 80 C160 55 220 55 220 80 L260 80 C260 55 320 55 320 80 L360 80 C360 55 420 55 420 80 L440 80 L440 140 L410 140 C405 105 375 105 370 140 L310 140 C305 105 275 105 270 140 L210 140 C205 105 175 105 170 140 L110 140 C105 105 75 105 70 140 L20 140 Z" fill="#826144"/>

    <!-- Cutwaters / Triangular Pier Protectors -->
    <polygon points="90,140 95,115 100,140" fill="#DDA15E"/>
    <polygon points="190,140 195,115 200,140" fill="#DDA15E"/>
    <polygon points="290,140 295,115 300,140" fill="#DDA15E"/>
    <polygon points="390,140 395,115 400,140" fill="#DDA15E"/>
  </g>

  <!-- Clear Badge Label -->
  <rect x="40" y="275" width="520" height="75" rx="10" fill="rgba(3, 4, 94, 0.88)" stroke="#DDA15E" stroke-width="1.5"/>
  <text x="300" y="302" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FF7138" letter-spacing="1.5" text-anchor="middle">OFFICIAL HERITAGE ARCHIVE PLACEHOLDER</text>
  <text x="300" y="324" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Portuguese Bridge over Oum Er-Rbia</text>
  <text x="300" y="341" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#CAF0F8" text-anchor="middle">Khénifra Region • Historic Multi-Arch Stone Bridge (Alaouite Era)</text>
</svg>