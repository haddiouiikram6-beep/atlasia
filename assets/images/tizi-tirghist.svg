<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#826144"/>
      <stop offset="60%" stop-color="#90877E"/>
      <stop offset="100%" stop-color="#585F3A"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bgGrad2)"/>

  <!-- Stylized Sandstone Rock Slab with Bronze Age Petroglyphs -->
  <g transform="translate(190, 45)">
    <!-- Sandstone Slab -->
    <path d="M10 40 L190 20 L220 160 L20 180 Z" fill="#DDA15E" opacity="0.9" stroke="#826144" stroke-width="2"/>
    <!-- Bronze Age Round Shield Engraving -->
    <circle cx="110" cy="85" r="32" fill="none" stroke="#283618" stroke-width="3" stroke-dasharray="4,3"/>
    <circle cx="110" cy="85" r="22" fill="none" stroke="#283618" stroke-width="2.5"/>
    <circle cx="110" cy="85" r="8" fill="#283618"/>
    <line x1="88" y1="85" x2="132" y2="85" stroke="#283618" stroke-width="2"/>
    <line x1="110" y1="63" x2="110" y2="107" stroke="#283618" stroke-width="2"/>
    
    <!-- Bronze Age Dagger Engraving -->
    <path d="M165 65 L175 75 L160 135 L155 130 Z" fill="#283618"/>
    <line x1="150" y1="125" x2="175" y2="125" stroke="#283618" stroke-width="3"/>
    
    <!-- Anthropomorphic Hunter Figure -->
    <circle cx="60" cy="115" r="6" fill="#283618"/>
    <line x1="60" y1="121" x2="60" y2="145" stroke="#283618" stroke-width="2.5"/>
    <line x1="48" y1="130" x2="72" y2="125" stroke="#283618" stroke-width="2"/>
    <line x1="60" y1="145" x2="50" y2="165" stroke="#283618" stroke-width="2"/>
    <line x1="60" y1="145" x2="70" y2="165" stroke="#283618" stroke-width="2"/>
  </g>

  <!-- Clear Badge Label -->
  <rect x="40" y="275" width="520" height="75" rx="10" fill="rgba(3, 4, 94, 0.88)" stroke="#DDA15E" stroke-width="1.5"/>
  <text x="300" y="302" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FF7138" letter-spacing="1.5" text-anchor="middle">OFFICIAL HERITAGE ARCHIVE PLACEHOLDER</text>
  <text x="300" y="324" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Tizi n'Tirghist Prehistoric Rock Engravings</text>
  <text x="300" y="341" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#CAF0F8" text-anchor="middle">Azilal High Atlas (2,400m) • Bronze Age Petroglyphs (c. 1500–1000 BCE)</text>
</svg>