<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03045E"/>
      <stop offset="50%" stop-color="#283618"/>
      <stop offset="100%" stop-color="#826144"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#bgGrad4)"/>

  <!-- Stylized Museum Showcase with Prehistoric Mosasaur Marine Fossil -->
  <g transform="translate(160, 45)">
    <!-- Showcase Glass Box -->
    <rect x="20" y="25" width="240" height="150" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="#DDA15E" stroke-width="2"/>
    <rect x="40" y="145" width="200" height="20" rx="3" fill="#826144"/>

    <!-- Fossilized Marine Reptile (Mosasaur) Skull Profile -->
    <path d="M60 130 C100 120 180 90 220 95 C200 105 180 120 140 125 C110 128 80 133 60 130 Z" fill="#DDA15E" stroke="#BC6C25" stroke-width="1.5"/>
    <circle cx="180" cy="102" r="7" fill="#03045E"/>
    <!-- Fossil Teeth -->
    <polygon points="100,128 103,136 106,128" fill="#FFFFFF"/>
    <polygon points="112,128 115,136 118,128" fill="#FFFFFF"/>
    <polygon points="124,127 127,135 130,127" fill="#FFFFFF"/>
    <polygon points="136,126 139,134 142,126" fill="#FFFFFF"/>
    <polygon points="148,124 151,132 154,124" fill="#FFFFFF"/>
    <polygon points="160,122 163,130 166,122" fill="#FFFFFF"/>

    <!-- Museum Exhibition Spotlight -->
    <polygon points="140,25 60,170 220,170" fill="rgba(254, 250, 224, 0.08)"/>
  </g>

  <!-- Clear Badge Label -->
  <rect x="40" y="275" width="520" height="75" rx="10" fill="rgba(3, 4, 94, 0.88)" stroke="#DDA15E" stroke-width="1.5"/>
  <text x="300" y="302" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FF7138" letter-spacing="1.5" text-anchor="middle">OFFICIAL HERITAGE ARCHIVE PLACEHOLDER</text>
  <text x="300" y="324" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">National Museum of Phosphate Mines</text>
  <text x="300" y="341" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#CAF0F8" text-anchor="middle">Khouribga Mining District • Industrial Heritage & Cretaceous Paleontology</text>
</svg>