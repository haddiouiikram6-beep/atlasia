<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#283618"/>
      <stop offset="60%" stop-color="#585F3A"/>
      <stop offset="100%" stop-color="#826144"/>
    </linearGradient>
    <pattern id="moroccanGrid1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M15 0L30 15L15 30L0 15Z" fill="none" stroke="#DDA15E" stroke-width="0.8" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="600" height="380" fill="url(#bgGrad1)"/>
  <rect width="600" height="380" fill="url(#moroccanGrid1)"/>
  
  <!-- Stylized Multi-story Collective Granary (Igherm) -->
  <g transform="translate(180, 50)">
    <!-- Fortress Granary Body -->
    <rect x="50" y="40" width="140" height="150" rx="4" fill="#DDA15E" opacity="0.95"/>
    <polygon points="40,40 50,20 190,20 200,40" fill="#826144"/>
    <!-- Stepped Crenellations -->
    <rect x="50" y="10" width="18" height="14" fill="#BC6C25"/>
    <rect x="80" y="10" width="18" height="14" fill="#BC6C25"/>
    <rect x="111" y="10" width="18" height="14" fill="#BC6C25"/>
    <rect x="142" y="10" width="18" height="14" fill="#BC6C25"/>
    <rect x="172" y="10" width="18" height="14" fill="#BC6C25"/>
    
    <!-- Wooden Vault Doors (Levels 1 to 3) -->
    <rect x="65" y="55" width="24" height="30" rx="2" fill="#283618"/>
    <rect x="108" y="55" width="24" height="30" rx="2" fill="#283618"/>
    <rect x="151" y="55" width="24" height="30" rx="2" fill="#283618"/>
    
    <rect x="65" y="100" width="24" height="30" rx="2" fill="#283618"/>
    <rect x="108" y="100" width="24" height="30" rx="2" fill="#283618"/>
    <rect x="151" y="100" width="24" height="30" rx="2" fill="#283618"/>

    <rect x="65" y="145" width="24" height="35" rx="2" fill="#283618"/>
    <rect x="108" y="145" width="24" height="35" rx="2" fill="#826144"/>
    <rect x="151" y="145" width="24" height="35" rx="2" fill="#283618"/>
    
    <!-- Juniper Timbers protruding -->
    <line x1="45" y1="90" x2="195" y2="90" stroke="#826144" stroke-width="4"/>
    <line x1="45" y1="135" x2="195" y2="135" stroke="#826144" stroke-width="4"/>
  </g>

  <!-- Clear Badge Label -->
  <rect x="40" y="275" width="520" height="75" rx="10" fill="rgba(3, 4, 94, 0.88)" stroke="#DDA15E" stroke-width="1.5"/>
  <text x="300" y="302" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="800" fill="#FF7138" letter-spacing="1.5" text-anchor="middle">OFFICIAL HERITAGE ARCHIVE PLACEHOLDER</text>
  <text x="300" y="324" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Amezraï Collective Granary (Igherm)</text>
  <text x="300" y="341" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#CAF0F8" text-anchor="middle">Aït Bouguemez Valley, Azilal • UNESCO Geopark M'Goun</text>
</svg>